name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # The tag is read against the version the source declares, with the `v` prefix taken off,
    # because the workflow names the tag form and the source names the value. The read is the same
    # one `Scripts/build-release.sh` makes for the on-demand static build, so both halves compare
    # the tag with the source rather than with a number the workflow writes. The binary's `version`
    # answer is read after the build, which is the half a workflow can only show by running the
    # artifact, so a release built from another commit is the failure this step names.
    name: Build the release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - name: Read the version the source declares
        id: version
        run: |
          sed_read='s/.*public static let version = "\([^"]*\)".*/\1/p'
          declared=$(sed -n "$sed_read" Sources/RivuletCore/RivuletCore.swift)
          [ -n "$declared" ] || { echo "the source declares no version to read"; exit 1; }
          tag=${GITHUB_REF_NAME#v}
          [ "$tag" = "$declared" ] || { echo "the tag is not the version the source declares (${declared})"; exit 1; }
          echo "version=$declared" >>"$GITHUB_OUTPUT"

      - name: Build for the release configuration
        run: swift build -c release

      - name: Read the version the built binary answers
        run: |
          answer=$(.build/release/rivulet version)
          [ "$answer" = "rivulet ${{ steps.version.outputs.version }}" ] ||
            { echo "the binary answers ${answer}, not the version the source declares"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rivulet-${{ steps.version.outputs.version }}-linux
          path: .build/release/rivulet

  publish:
    # The release is created from the artifact the build job uploaded. `gh` is not in the Swift
    # container, so this job runs on the runner host, which has it. The token is the one the runner
    # gives the job, so no secret is read and the workflow stores no personal values.
    # What this workflow cannot show is named here rather than attempted: the statically linked musl
    # artifact `Scripts/build-release.sh` builds is not built by CI, because there is no download URL
    # for the Static Linux SDK that this workflow can read — every candidate answered 404 when the
    # machine tested them, so the SDK has to be installed by hand, which is where the stage-8 spike
    # ran. The artifact attached to the release is the glibc build this job produced, and the release
    # is not read by any rule, so nothing here claims a check half read it.
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rivulet-${{ needs.build.outputs.version }}-linux

      - name: Create the release with the artifact
        run: |
          notes="Release ${{ needs.build.outputs.version }}, built by this workflow from the tag that names it."
          notes="$notes The glibc artifact is attached; the statically linked musl artifact is built on"
          notes="$notes demand by Scripts/build-release.sh, which CI cannot run because the Static Linux"
          notes="$notes SDK has no download URL this workflow reads."
          gh release create "$GITHUB_REF_NAME" --confirm \
            --title "Rivulet ${{ needs.build.outputs.version }}" \
            --notes "$notes" rivulet
