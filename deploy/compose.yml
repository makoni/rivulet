# Example compose file. Build the image from the static binary (see the Dockerfile), put the
# configuration in `../.env` (see `.env.example`), and mount a volume for the database.
services:
  rivulet:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rivulet
    # The image's ENTRYPOINT is the binary alone, so the subcommand comes from here.
    command: serve
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    volumes:
      - rivulet-data:/var/lib/rivulet
volumes:
  rivulet-data:
